<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name – Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F7;--panel:rgba(255,255,255,.72);--text:#12172A;--mute:#505874;--line:rgba(18,23,42,.14);--a:#5B4BFF;--b:#E58A00;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1120;--panel:rgba(20,26,48,.7);--text:#E7EAF5;--mute:#9AA3C0;--line:rgba(231,234,245,.16);--a:#8F83FF;--b:#FFB547;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1120;--panel:rgba(20,26,48,.7);--text:#E7EAF5;--mute:#9AA3C0;--line:rgba(231,234,245,.16);--a:#8F83FF;--b:#FFB547;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.6 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.05;margin:0}
#gl{position:absolute;inset:0;width:100%;height:100%;z-index:0}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(18px,5vw,56px);backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 70%,transparent)}
nav b{font-family:"Bricolage Grotesque",sans-serif;font-size:19px}
nav div{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav a,nav button{color:var(--text);text-decoration:none;font:500 14px "DM Sans",sans-serif;padding:7px 11px;border-radius:99px;background:none;border:0;cursor:pointer}
nav a:hover,nav button:hover{background:var(--line)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
main{position:relative;z-index:2}
section{padding:110px clamp(18px,5vw,56px) 40px;max-width:1180px}
.hero{position:relative;max-width:none;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:90px 20px 9vh;overflow:hidden;--bg:#080B18;--text:#E7EAF5;--mute:#A8B0CC;--line:rgba(231,234,245,.18);--panel:rgba(20,26,48,.7);--a:#8F83FF;--b:#FFB547;background:radial-gradient(ellipse at 50% 42%,#141B3A 0%,#080B18 72%);color:var(--text)}
.hero>*:not(canvas){position:relative;z-index:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero p{font-size:clamp(18px,2.2vw,23px);color:var(--mute);max-width:30em;margin:0 auto 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 22px;border-radius:12px;font-weight:500;text-decoration:none;border:1px solid var(--line);color:var(--text);background:var(--panel);backdrop-filter:blur(8px);transition:transform .2s}
.btn.pri{background:var(--a);color:#fff;border-color:var(--a)}
.btn:hover{transform:translateY(-3px)}
h2{font-size:clamp(30px,5vw,52px);font-weight:700;letter-spacing:-.02em;margin-bottom:26px}
.col{max-width:640px}
.about p{margin:0 0 16px;color:var(--mute);font-size:18px}
.facts{display:flex;gap:26px;flex-wrap:wrap;margin-top:24px}
.facts div{border-left:3px solid var(--b);padding-left:12px}
.facts b{display:block;font:700 28px "Bricolage Grotesque",sans-serif}
.facts span{color:var(--mute);font-size:14px}
.skills{display:grid;gap:18px;max-width:640px}
.skills h3{font-size:18px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);font-size:15px;cursor:default;transition:background .2s,color .2s}
.chip:hover{background:var(--a);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;max-width:900px}
.card{perspective:800px}
.card>div{height:100%;padding:24px;border-radius:18px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);transition:transform .15s ease-out;transform-style:preserve-3d}
.card h3{font-size:22px;margin-bottom:8px}
.card p{margin:0 0 14px;color:var(--mute);font-size:16px}
.card .chips .chip{font-size:13px;padding:3px 10px}
.card a{color:var(--a);font-weight:500;text-decoration:none;display:inline-block;margin:12px 14px 0 0}
.tl{max-width:640px;border-left:2px solid var(--line);padding-left:24px;display:grid;gap:26px}
.tl article{position:relative}
.tl article::before{content:"";position:absolute;left:-31px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--b)}
.tl time{color:var(--mute);font-size:14px}
.tl h3{font-size:21px;margin:2px 0 6px}
.tl p{margin:0;color:var(--mute)}
form{display:grid;gap:12px;max-width:520px}
input,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:22px}
.links a{color:var(--text)}
footer{position:relative;z-index:2;padding:40px clamp(18px,5vw,56px) 60px;color:var(--mute);font-size:14px}
@media(max-width:700px){nav div a{display:none}#gl{opacity:.55}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.card>div{transition:none}}
.about .wrap{display:flex;gap:44px;align-items:center;flex-wrap:wrap}
.photo{width:230px;height:230px;border-radius:50%;object-fit:cover;border:3px solid var(--a);box-shadow:0 0 0 8px var(--line),0 0 50px color-mix(in srgb,var(--a) 40%,transparent)}
.certs{max-width:1000px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.certs img{width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block;margin-bottom:14px}
.certs .card p{margin:0;font-size:15px}
#lb{position:fixed;inset:0;z-index:30;background:rgba(5,8,18,.88);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lb[hidden]{display:none}#lb img{max-width:100%;max-height:100%;border-radius:10px}
</style>
</head>
<body>
<nav><b id="logo"></b><div><a href="#about">About</a><a href="#skills">Skills</a><a href="#work">Events</a><a href="#certs">Certificates</a><a href="#experience">Education</a><a href="#contact">Contact</a><button id="theme" aria-label="Switch light or dark theme">Theme</button></div></nav>
<main>
<section class="hero" id="top"><canvas id="gl" aria-hidden="true"></canvas><h1 class="sr" id="name"></h1><p id="tagline"></p><div class="btns"><a class="btn pri" href="#certs">View certificates</a><a class="btn" href="#contact">Get in touch</a></div></section>
<section id="about" class="about"><h2>About me</h2><div class="wrap"><img class="photo" id="photo" alt="Portrait of Atharva Pandey"><div class="col"><div id="aboutText"></div><div class="facts" id="facts"></div></div></div></section>
<section id="skills"><h2>Skills</h2><div class="skills" id="skillList"></div></section>
<section id="work"><h2>Hackathons and leadership</h2><div class="grid" id="projects"></div></section>
<section id="certs"><h2>Certificates</h2><div class="grid certs" id="certList"></div></section>
<section id="experience"><h2>Education and learning</h2><div class="tl" id="timeline"></div></section>
<section id="contact"><h2>Let’s work together</h2><form id="form"><input name="n" placeholder="Your name" required aria-label="Your name"><input name="e" type="email" placeholder="Your email" required aria-label="Your email"><textarea name="m" rows="4" placeholder="What would you like to build?" required aria-label="Message"></textarea><button class="btn pri" type="submit">Send message</button></form><div class="links" id="links"></div></section>
</main>
<div id="lb" hidden><img id="lbi" alt=""></div>
<footer id="foot"></footer>

const lb=$("lb"),open_=i=>{$("lbi").src=IMG["c"+i];lb.hidden=false};
$("certList").addEventListener("click",e=>{if(e.target.dataset.i)open_(e.target.dataset.i)});
$("certList").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.i)open_(e.target.dataset.i)});
lb.onclick=()=>lb.hidden=true;addEventListener("keydown",e=>{if(e.key==="Escape")lb.hidden=true});
$("timeline").innerHTML=ME.experience.map(e=>"<article><time>"+esc(e.when)+"</time><h3>"+esc(e.t)+"</h3><p>"+esc(e.d)+"</p></article>").join("");
$("links").innerHTML="<a href='mailto:"+esc(ME.email)+"'>"+esc(ME.email)+"</a>"+ME.links.map(l=>"<a href='"+esc(l[1])+"'>"+esc(l[0])+"</a>").join("");
$("foot").textContent="© "+new Date().getFullYear()+" "+ME.name;
$("form").addEventListener("submit",e=>{e.preventDefault();const f=e.target;
 location.href="mailto:"+ME.email+"?subject="+encodeURIComponent("Portfolio message from "+f.n.value)+"&body="+encodeURIComponent(f.m.value+"\n\n"+f.n.value+" ("+f.e.value+")");});

/* theme */
const root=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)");
const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":mq.matches;
$("theme").onclick=()=>{root.dataset.theme=isDark()?"light":"dark";paint()};

/* tilt on project cards (responds to the pointer) */
document.querySelectorAll(".card").forEach(c=>{const i=c.firstChild;
 c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;i.style.transform="rotateY("+x*10+"deg) rotateX("+-y*10+"deg)"});
 c.addEventListener("pointerleave",()=>i.style.transform="")});

/* 3D scene */
let paint=()=>{};
try{
const cv=$("gl"),hero=$("top"),R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(45,1,.1,100),A=0x8F83FF,B=0xFFB547,net=new THREE.Group();S.add(net);S.position.y=.5;
const P=[];for(let i=0;i<120;i++){const r=3.2+Math.random()*.7,t=Math.random()*6.283,p=Math.acos(2*Math.random()-1);P.push(new THREE.Vector3(r*Math.sin(p)*Math.cos(t),r*Math.sin(p)*Math.sin(t),r*Math.cos(p)))}
const E=[],lp=[];
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++)if(P[i].distanceTo(P[j])<1.9){E.push([i,j]);lp.push(P[i].x,P[i].y,P[i].z,P[j].x,P[j].y,P[j].z)}
const lg=new THREE.BufferGeometry();lg.setAttribute("position",new THREE.Float32BufferAttribute(lp,3));
net.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:A,transparent:true,opacity:.32})));
net.add(new THREE.Points(new THREE.BufferGeometry().setFromPoints(P),new THREE.PointsMaterial({color:0xffffff,size:.09,transparent:true,opacity:.9})));
const K=36,pul=Array.from({length:K},()=>({e:E[Math.random()*E.length|0],t:Math.random(),s:.004+Math.random()*.01})),pp=new Float32Array(K*3),pgm=new THREE.BufferGeometry();
pgm.setAttribute("position",new THREE.BufferAttribute(pp,3));
net.add(new THREE.Points(pgm,new THREE.PointsMaterial({color:B,size:.22,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})));
const rings=[1,2].map(k=>{const m=new THREE.Mesh(new THREE.TorusGeometry(2.4+k*.55,.01,8,160),new THREE.MeshBasicMaterial({color:k==1?B:A,transparent:true,opacity:.55}));m.rotation.x=1.2*k;S.add(m);return m});
const tc=document.createElement("canvas");tc.width=1400;tc.height=360;
const x=tc.getContext("2d"),tex=new THREE.CanvasTexture(tc);
const spr=new THREE.Mesh(new THREE.PlaneGeometry(5.6,1.44),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthTest:false}));spr.renderOrder=5;S.add(spr);
const NAME=ME.name.toUpperCase(),ROLES=["DATA ANALYST","WEB DEVELOPER","DATA SCIENCE + AI"],calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
let ni=calm?NAME.length:0,ri=0,rc=calm?ROLES[0].length:0,lt=0,hold=0;
function draw(){x.clearRect(0,0,1400,360);x.textBaseline="middle";x.textAlign="left";
 let f=150;x.font="800 "+f+"px 'Bricolage Grotesque',sans-serif";
 while(x.measureText(NAME).width>1300&&f>50){f-=6;x.font="800 "+f+"px 'Bricolage Grotesque',sans-serif"}
 const w=x.measureText(NAME).width,g=x.createLinearGradient(0,0,1400,0);g.addColorStop(0,"#fff");g.addColorStop(1,"#C9C3FF");
 x.fillStyle=g;x.shadowColor="rgba(143,131,255,.9)";x.shadowBlur=28;x.fillText(NAME.slice(0,ni)+(ni<NAME.length?"▌":""),(1400-w)/2,150);
 x.shadowBlur=0;x.font="700 86px 'DM Sans',sans-serif";x.fillStyle="#FFB547";
 const r=ROLES[ri].slice(0,rc)+(ni>=NAME.length?"▌":""),rw=x.measureText(ROLES[ri]).width;x.fillText(r,(1400-rw)/2,290);tex.needsUpdate=true}
function tick(n){if(calm||n-lt<80)return;lt=n;
 if(ni<NAME.length)ni++;
 else if(rc<ROLES[ri].length){rc++;if(rc==ROLES[ri].length)hold=n}
 else if(n-hold>1600){rc=0;ri=(ri+1)%ROLES.length}
 else return;draw()}
draw();document.fonts.ready.then(draw);
function size(){const w=hero.clientWidth,h=hero.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.position.z=Math.max(11,11.8/(.828*C.aspect));C.updateProjectionMatrix()}
size();addEventListener("resize",size);
let mx=0,my=0,vis=true;
hero.addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
new IntersectionObserver(e=>vis=e[0].isIntersecting).observe(hero);
const clock=new THREE.Clock();
(function loop(n){requestAnimationFrame(loop);if(!vis)return;const t=calm?0:clock.getElapsedTime();tick(n);
 net.rotation.y+=(t*.12+mx*.9-net.rotation.y)*.06;net.rotation.x+=(my*.6-net.rotation.x)*.06;
 rings[0].rotation.z=t*.3;rings[1].rotation.z=-t*.2;rings[0].rotation.y=t*.15;rings[1].rotation.y=mx;
 pul.forEach((u,i)=>{u.t+=calm?0:u.s;if(u.t>1){u.t=0;u.e=E[Math.random()*E.length|0]}const a=P[u.e[0]],b=P[u.e[1]];pp.set([a.x+(b.x-a.x)*u.t,a.y+(b.y-a.y)*u.t,a.z+(b.z-a.z)*u.t],i*3)});
 pgm.attributes.position.needsUpdate=true;R.render(S,C)})();
}catch(e){document.getElementById("gl").style.display="none"}
</script>
</body>
</html>
